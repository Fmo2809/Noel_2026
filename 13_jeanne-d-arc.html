<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Énigme 13 – Rue Jeanne d'Arc</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Image historique en médaillon -->
    <img src="IMAGE-Paris-Histoire.jpeg" alt="Paris historique" class="medaillon">

    <!-- Texte de référence -->
    <p class="ref-texte">
        Hommage à Jeanne d'<b>Arc</b> (v. 1412-1431), héroïne de la guerre de <b>Cent</b> Ans et figure emblématique de l'histoire nationale, qui délivra Orléans et fit sacrer le roi Charles VII à Reims.
    </p>

    <!-- Enigme suivante -->
    <div class="enigme">Enigme 14</div>

    <!-- Image de l'énigme 14 -->
    <img src="IMAGE-14.jpeg" alt="Énigme 14" class="enigme-img">

    <!-- Réponse attendue -->
    <div class="reponse-zone">
        <label for="reponse">Réponse :</label>
        <input type="text" id="reponse" name="reponse" autocomplete="off">
    </div>
</div>

<script>
document.getElementById("reponse").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        const val = this.value.trim().toLowerCase();
        if (val === "general-leclerc") {
            window.location.href = "/14_general-leclerc.html";
        } else {
            this.value = "";
        }
    }
});
</script>
    
</body>
</html>
