<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Énigme 10 – Place du Colonel Fabien</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Image historique en médaillon -->
    <img src="IMAGE-Paris-Histoire.jpeg" alt="Paris historique" class="medaillon">

    <!-- Texte de référence -->
    <p class="ref-texte">
        Place du Colonel Fabien : Honore Pierre Georges, dit « Colonel Fabien » (1919-1944), résistant communiste qui exécuta un officier allemand au métro Barbès en 1941, marquant le début de la résistance armée dans la capitale sous l'Occupation.
    </p>

    <!-- Enigme suivante -->
    <div class="enigme">Enigme 11</div>

    <!-- Image de l'énigme 11 -->
    <img src="IMAGE-11.jpeg" alt="Énigme 11" class="enigme-img">

    <!-- Réponse attendue -->
    <div class="reponse-zone">
        <label for="reponse">Réponse :</label>
        <input type="text" id="reponse" name="reponse" autocomplete="off">
    </div>
</div>

<script>
document.getElementById("reponse").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        const val = this.value.trim().toLowerCase();
        if (val === "roquette" || val === "la-roquette") {
            window.location.href = "/11_roquette.html";
        } else {
            this.value = "";
        }
    }
});
</script>
    
</body>
