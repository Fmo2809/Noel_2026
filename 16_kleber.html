<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Énigme 16 - Kleber</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Image historique en médaillon -->
    <img src="IMAGE-Paris-Histoire.jpeg" alt="Paris historique" class="medaillon">

    <!-- Texte de référence -->
    <p class="ref-texte">
        Nommée en l'honneur du général Jean-Baptiste <b>Kléber</b> (1753-1800), héros des guerres de la Révolution française, victorieux à Fleurus. Il s'illustra lors de <b>la campagne d'Égypte</b> avant d'y être assassiné. L'Arc de Triomphe, au début de l'avenue, célèbre ses victoires.
    </p>

    <!-- Enigme suivante -->
    <div class="enigme">Enigme 17</div>

    <!-- Image de l'énigme 17 -->
    <img src="IMAGE-17.jpeg" alt="Énigme 17" class="enigme-img">

    <!-- Réponse attendue -->
    <div class="reponse-zone">
        <label for="reponse">Réponse :</label>
        <input type="text" id="reponse" name="reponse" autocomplete="off">
    </div>
</div>

<script>
document.getElementById("reponse").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        const val = this.value.trim().toLowerCase();
        if (val === "marechal-juin") {
            window.location.href = "/17_marechal-juin.html";
        } else {
            this.value = "";
        }
    }
});
</script>
    
</body>
</html>
