<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Énigme 08 – Place Vauban</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Image historique en médaillon -->
    <img src="IMAGE-Paris-Histoire.jpeg" alt="Paris historique" class="medaillon">

    <!-- Texte de référence -->
    <p class="ref-texte">
        Place Vauban : Tracée au XVIIIème siècle dans le cadre du réaménagement de la place Louis XV, elle symbolise l'urbanisme monarchique des Lumières sous Louis XV. Elle fut le lieu de violents combats lors de la Semaine sanglante sous la Commune de Paris en 1871.. 
    </p>

    <!-- Enigme suivante -->
    <div class="enigme">Enigme 08</div>

    <!-- Image de l'énigme 08 -->
    <img src="IMAGE-08.jpeg" alt="Énigme 08" class="enigme-img">

    <!-- Réponse attendue -->
    <div class="reponse-zone">
        <label for="reponse">Réponse :</label>
        <input type="text" id="reponse" name="reponse" autocomplete="off">
    </div>
</div>

<script>
document.getElementById("reponse").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        const val = this.value.trim().toLowerCase();
        if (val === "royale") {
            window.location.href = "/08_royale.html";
        } else {
            this.value = "";
        }
    }
});
</script>
    
</body>
</html>
