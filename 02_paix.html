<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Énigme 02 – Rue de la Paix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Image historique en médaillon -->
    <img src="IMAGE-Paris-Histoire.jpeg" alt="Paris historique" class="medaillon">

    <!-- Texte de référence -->
    <p class="ref-texte">
        Rue de la Paix (en langage des signes, et au Monopoly) : <br>
        Nommée en 1814 pour célébrer le traité de Paris de 1814 qui rétablissait la paix en Europe 
        après la première abdication de Napoléon Ier. <br> 
        Elle s'appelait initialement rue Napoléon.
    </p>

    <!-- Enigme suivante -->
    <div class="enigme">Enigme 03</div>

    <!-- Image de l'énigme 03 -->
    <img src="IMAGE-03.jpeg" alt="Énigme 03" class="enigme-img">

    <!-- Réponse attendue -->
    <div class="reponse-zone">
        <label for="reponse">Réponse :</label>
        <input type="text" id="reponse" name="reponse" autocomplete="off">
    </div>
</div>

<script>
document.getElementById("reponse").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        const val = this.value.trim().toLowerCase();
        if (val === "turenne") {
            window.location.href = "/03_turenne.html";
        } else {
            this.value = "";
        }
    }
});
</script>
    
</body>
</html>
