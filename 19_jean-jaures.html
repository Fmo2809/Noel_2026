<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Énigme 19 - Avenue Jean Jaurès</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Image historique en médaillon -->
    <img src="IMAGE-Paris-Histoire.jpeg" alt="Paris historique" class="medaillon">

    <!-- Texte de référence -->
    <p class="ref-texte">
        Av. Jean Jaurès : <br> 
        Renommée dès août 1914 pour honorer Jean Jaurès (1859-1914), figure majeure du socialisme français, <br>
        fondateur du journal <b>L'Humanité</b> et fervent pacifiste assassiné à la veille du déclenchement de la Première Guerre mondiale.
    </p>

    <!-- Enigme suivante -->
    <div class="enigme">Enigme 20</div>

    <!-- Image de l'énigme 20 -->
    <img src="IMAGE-20.jpeg" alt="Énigme 20" class="enigme-img">

    <!-- Réponse attendue -->
    <div class="reponse-zone">
        <label for="reponse">Réponse :</label>
        <input type="text" id="reponse" name="reponse" autocomplete="off">
    </div>
</div>

<script>
document.getElementById("reponse").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        const val = this.value.trim().toLowerCase();
        if (val === "gambetta") {
            window.location.href = "/20_gambetta.html";
        } else {
            this.value = "";
        }
    }
});
</script>
    
</body>
</html>
