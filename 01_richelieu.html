<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Énigme 01 – Richelieu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            margin: 0;
            padding: 0;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
        }

        .medaillon {
            width: 30%;
            display: block;
            margin: 30px auto;
            border-radius: 50%;
        }

        .ref-texte {
            font-style: italic;
            font-family: "Times New Roman", serif;
            font-size: 1.2em;
            text-align: center;
            margin-top: 10px;
        }

        .enigme {
            margin-top: 40px;
            text-align: center;
            font-size: 1.6em;
            font-weight: bold;
        }

        .enigme-img {
            width: 50%;
            display: block;
            margin: 25px auto;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Image historique en médaillon -->
    <img src="IMAGE-Paris-Histoire.jpeg" alt="Paris historique" class="medaillon">

    <!-- Texte de référence -->
    <p class="ref-texte">
        rue de Richelieu : Nommée en l'honneur d'Armand Jean du Plessis, cardinal de Richelieu (1585-1642), 
        principal ministre de Louis XIII. La voie menait à son palais (l'actuel Palais-Royal). </p>
    <p> Et c'était, bien sûr, l'ennemi préféré des Mousquetaires d'A. Dumas !
    </p>

    <!-- Enigme suivante -->
    <div class="enigme">Enigme 02</div>

    <!-- Image de l'énigme 02 -->
    <img src="IMAGE-02.jpeg" alt="Énigme 02" class="enigme-img">

</div>

</body>
</html>
